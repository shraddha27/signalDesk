services:
  - type: web
    name: signaldesk-demo
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: signaldesk-demo-db
          property: connectionString
      - key: DEMO_MODE
        value: "true"

databases:
  - name: signaldesk-demo-db
    databaseName: signaldesk_demo
    user: signaldesk
    plan: free
    region: singapore
